<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진로 나침반 - 대학생 진로 앱</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--sub:#5b6478;--line:#dde2ec;--accent:#2f5bff;--accent-ink:#fff;--hl:#ffd84d;--ok:#1f9d63;--bad:#d64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f35;--ink:#eef1f8;--sub:#9aa5bd;--line:#2a3452;--accent:#7b98ff;--accent-ink:#0e1424;--hl:#e8c53a}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f35;--ink:#eef1f8;--sub:#9aa5bd;--line:#2a3452;--accent:#7b98ff;--accent-ink:#0e1424;--hl:#e8c53a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.65;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(30px,7vw,46px);line-height:1.2;margin:8px 0 10px;letter-spacing:-.02em}
h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px}
.lead{color:var(--sub);margin:0 0 24px;max-width:34em}
nav{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:22px;overflow-x:auto}
nav button{font:inherit;font-weight:500;background:none;border:0;color:var(--sub);padding:11px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.q{font-size:20px;font-weight:700;margin:0 0 16px;line-height:1.45}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .1s}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.99)}
.meta{color:var(--sub);font-size:14px}
.result h2{font-size:28px;margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px;padding:0;list-style:none}
.chips li{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:14px}
.scores{display:grid;gap:8px;margin:16px 0}
.score{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.score .bar{margin:0}
.year{margin-bottom:16px}
.year h3{margin:0 0 4px;font-size:18px}
.task{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.task input{width:20px;height:20px;margin-top:4px;accent-color:var(--accent);flex:none}
.task input:checked+span{color:var(--sub);text-decoration:line-through}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.form .full{grid-column:1/-1}
input[type=text],input[type=date],select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{font-size:14px;color:var(--sub);display:block;margin-bottom:4px}
.app{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.app b{font-size:17px}
.app select{width:auto;padding:6px 8px;font-size:14px}
.dday{font-weight:700;font-size:14px}
.del{font:inherit;background:none;border:0;color:var(--bad);cursor:pointer;font-size:14px;padding:4px}
.empty{color:var(--sub);text-align:center;padding:26px 0}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.stat div{font-size:14px;color:var(--sub)}
.stat strong{display:block;font-size:26px;color:var(--ink)}
@media(max-width:520px){.form{grid-template-columns:1fr}.score{grid-template-columns:60px 1fr 30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>지금 내게 맞는 길, <mark>진로 나침반</mark></h1>
  <p class="lead">성향을 확인하고, 학년별로 준비할 일을 체크하고, 지원 일정을 한곳에서 관리하세요.</p>
  <nav role="tablist" aria-label="메뉴">
    <button role="tab" aria-selected="true" data-tab="test">성향 테스트</button>
    <button role="tab" aria-selected="false" data-tab="road">학년별 로드맵</button>
    <button role="tab" aria-selected="false" data-tab="apply">지원 현황</button>
  </nav>

  <section id="test"></section>
  <section id="road" hidden></section>
  <section id="apply" hidden></section>
</div>

<script>
// ---------- 저장 유틸 (실패해도 동작) ----------
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- 탭 ----------
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['test','road','apply'].forEach(id=>$('#'+id).hidden=id!==b.dataset.tab);
});

// ---------- 1. 성향 테스트 ----------
const TYPES={
  A:{name:'분석형',desc:'데이터와 논리로 문제를 푸는 걸 좋아해요. 근거를 찾고 구조를 세울 때 가장 몰입합니다.',jobs:['데이터 분석가','전략 기획','연구원','금융·회계','소프트웨어 개발'],next:'공모전·프로젝트로 분석 결과물을 포트폴리오에 남겨 보세요.'},
  C:{name:'창작형',desc:'새로운 아이디어를 만들고 표현하는 데서 에너지를 얻어요. 남다른 시각이 강점입니다.',jobs:['UX·UI 디자이너','콘텐츠 기획','브랜드 마케터','영상·미디어','게임 기획'],next:'작업물을 꾸준히 공개해 나만의 포트폴리오를 쌓아 보세요.'},
  P:{name:'사람형',desc:'사람을 이해하고 돕는 일에서 보람을 느껴요. 소통과 공감이 강점입니다.',jobs:['HR·인사','교육·상담','서비스 기획','영업·CS','공공·사회복지'],next:'동아리 운영이나 멘토링 같은 협업 경험을 만들어 보세요.'},
  B:{name:'도전형',desc:'직접 부딪혀 결과를 만드는 걸 좋아해요. 빠른 실행과 주도성이 강점입니다.',jobs:['창업','사업개발(BD)','프로덕트 매니저','컨설팅','해외영업'],next:'작은 프로젝트라도 직접 시작해 성과를 숫자로 기록해 보세요.'}
};
const QS=[
 ['팀 프로젝트에서 내가 자연스럽게 맡는 역할은?',{A:'자료 조사와 정리',C:'아이디어와 콘셉트 제안',P:'팀 분위기와 일정 조율',B:'방향을 정하고 밀어붙이기'}],
 ['시간 가는 줄 모르고 하는 활동은?',{A:'퍼즐, 데이터 파헤치기',C:'그리기, 글쓰기, 영상 만들기',P:'친구 고민 들어주기',B:'새로운 걸 시도하고 만들어 보기'}],
 ['일을 고를 때 가장 중요한 기준은?',{A:'전문성과 성장',C:'자유도와 개성',P:'사람들과의 관계, 의미',B:'성과와 보상'}],
 ['과제가 막혔을 때 나는?',{A:'원인을 하나씩 분석한다',C:'다른 방식으로 접근해 본다',P:'주변에 물어보고 함께 푼다',B:'일단 해보면서 고친다'}],
 ['이상적인 근무 환경은?',{A:'조용히 깊게 몰입',C:'자유롭고 유연한 분위기',P:'사람들과 활발히 소통',B:'빠르게 변하는 도전적 환경'}],
 ['친구들이 나를 이렇게 말한다면?',{A:'"꼼꼼하고 똑똑해"',C:'"독특하고 재밌어"',P:'"잘 들어주고 따뜻해"',B:'"추진력 대박이야"'}],
 ['처음 하는 일을 배울 때?',{A:'원리부터 이해한다',C:'내 스타일로 바꿔 본다',P:'잘하는 사람에게 배운다',B:'바로 실전에 뛰어든다'}],
 ['10년 뒤 듣고 싶은 말은?',{A:'"그 분야 최고 전문가"',C:'"이 사람만의 작품이 있다"',P:'"당신 덕분에 힘이 됐어요"',B:'"직접 일궈낸 사람"'}]
];
let qi=0,ans=[];
function renderTest(){
  const el=$('#test');
  if(qi>=QS.length){return renderResult(el)}
  const [q,o]=QS[qi];
  el.innerHTML=`<div class="card"><div class="meta">${qi+1} / ${QS.length}</div>
   <div class="bar"><i style="width:${qi/QS.length*100}%"></i></div>
   <p class="q">${q}</p><div class="opts">${Object.entries(o).map(([k,t])=>`<button class="opt" data-k="${k}">${t}</button>`).join('')}</div></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans.push(b.dataset.k);qi++;renderTest()});
}
function renderResult(el){
  const sc={A:0,C:0,P:0,B:0};ans.forEach(k=>sc[k]++);
  const sorted=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  const t=TYPES[sorted[0][0]],sub=TYPES[sorted[1][0]];
  store.set('cc_result',sorted[0][0]);
  el.innerHTML=`<div class="card result"><div class="meta">나의 진로 성향</div>
   <h2>${t.name}</h2><p>${t.desc}</p>
   <div class="scores">${Object.entries(TYPES).map(([k,v])=>`<div class="score"><span>${v.name}</span><div class="bar"><i style="width:${sc[k]/QS.length*100}%"></i></div><span>${sc[k]}</span></div>`).join('')}</div>
   <strong>추천 직무</strong><ul class="chips">${t.jobs.map(j=>`<li>${j}</li>`).join('')}</ul>
   <p><strong>다음 한 걸음</strong><br>${t.next}</p>
   <p class="meta">보조 성향은 ${sub.name}이에요. ${sub.jobs.slice(0,2).join(', ')} 분야도 함께 살펴보세요.</p>
   <button class="btn" id="retry">다시 테스트하기</button></div>`;
  $('#retry').onclick=()=>{qi=0;ans=[];renderTest()};
}
renderTest();

// ---------- 2. 로드맵 ----------
const ROAD={
 '1학년':['학과 공부에 집중해 학점 기반 만들기','동아리·학회 1곳 가입하기','관심 직무 3개 적어 보기','기초 어학 점수 준비 시작','선배·졸업생과 대화해 보기'],
 '2학년':['전공 심화 과목 수강하며 관심 분야 좁히기','공모전이나 팀 프로젝트 1회 참여','자격증 로드맵 세우기','인턴·대외활동 정보 모으기','방학 중 소규모 프로젝트 완성'],
 '3학년':['직무 관련 인턴 지원하기','포트폴리오 초안 만들기','어학·자격증 취득 마무리','현직자 인터뷰 3회 이상','이력서와 자기소개서 첫 버전 작성'],
 '4학년':['희망 기업 리스트와 채용 일정 정리','자기소개서 기업별로 다듬기','모의 면접 3회 이상 연습','포트폴리오 최종 점검','지원 현황 꾸준히 기록하기']
};
let done=store.get('cc_road',{});
function renderRoad(){
  const all=Object.entries(ROAD).flatMap(([y,l])=>l.map((_,i)=>y+i));
  const n=all.filter(k=>done[k]).length,pct=Math.round(n/all.length*100);
  $('#road').innerHTML=`<div class="card"><strong>전체 진행률 ${pct}%</strong> <span class="meta">(${n}/${all.length})</span>
   <div class="bar"><i style="width:${pct}%"></i></div>
   ${Object.entries(ROAD).map(([y,l])=>`<div class="year"><h3>${y}</h3>${l.map((t,i)=>`<label class="task"><input type="checkbox" data-k="${y+i}" ${done[y+i]?'checked':''}><span>${t}</span></label>`).join('')}</div>`).join('')}</div>`;
  $('#road').querySelectorAll('input').forEach(c=>c.onchange=()=>{done[c.dataset.k]=c.checked;store.set('cc_road',done);renderRoad()});
}
renderRoad();

// ---------- 3. 지원 현황 ----------
const ST=['관심','서류 접수','면접','합격','불합격'];
let apps=store.get('cc_apps',[]);
function dday(d){
  if(!d)return '';
  const diff=Math.round((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
  return diff===0?'D-Day':diff>0?'D-'+diff:'마감 '+(-diff)+'일 지남';
}
function renderApply(){
  const cnt=s=>apps.filter(a=>a.st===s).length;
  $('#apply').innerHTML=`<div class="card">
   <div class="form">
    <div><label for="co">회사</label><input type="text" id="co" placeholder="예: 한빛소프트"></div>
    <div><label for="po">직무</label><input type="text" id="po" placeholder="예: 서비스 기획"></div>
    <div><label for="dl">마감일</label><input type="date" id="dl"></div>
    <div><label for="stt">상태</label><select id="stt">${ST.map(s=>`<option>${s}</option>`).join('')}</select></div>
    <div class="full"><button class="btn" id="add">지원 추가하기</button></div>
   </div>
   <div class="stat"><div><strong>${apps.length}</strong>전체</div><div><strong>${cnt('서류 접수')+cnt('면접')}</strong>진행 중</div><div><strong>${cnt('합격')}</strong>합격</div></div>
   <div id="list">${apps.length?[...apps].sort((a,b)=>(a.dl||'9')>(b.dl||'9')?1:-1).map(a=>`<div class="app">
     <div><b>${esc(a.co)}</b> <span class="meta">${esc(a.po)}</span></div>
     <select data-id="${a.id}" aria-label="상태 변경">${ST.map(s=>`<option ${s===a.st?'selected':''}>${s}</option>`).join('')}</select>
     <span class="dday">${dday(a.dl)}</span><button class="del" data-id="${a.id}">삭제</button></div>`).join(''):'<div class="empty">아직 등록한 지원이 없어요. 관심 있는 회사부터 추가해 보세요.</div>'}</div></div>`;
  $('#add').onclick=()=>{
    const co=$('#co').value.trim();
    if(!co){$('#co').focus();return}
    apps.push({id:Date.now(),co,po:$('#po').value.trim()||'직무 미정',dl:$('#dl').value,st:$('#stt').value});
    store.set('cc_apps',apps);renderApply();
  };
  $('#list').querySelectorAll('select').forEach(s=>s.onchange=()=>{apps.find(a=>a.id==s.dataset.id).st=s.value;store.set('cc_apps',apps);renderApply()});
  $('#list').querySelectorAll('.del').forEach(b=>b.onclick=()=>{apps=apps.filter(a=>a.id!=b.dataset.id);store.set('cc_apps',apps);renderApply()});
}
renderApply();
</script>
</body>
</html>
